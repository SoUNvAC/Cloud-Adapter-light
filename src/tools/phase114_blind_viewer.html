<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>匿名影像判读</title><style>body{font-family:system-ui;margin:0;color:#17212b;background:#f5f6f8}aside{position:fixed;top:0;bottom:0;width:145px;overflow:auto;background:white;padding:16px}main{margin-left:190px;padding:24px;max-width:1500px}button,select,input,textarea{font:inherit;padding:7px;margin:4px}aside button{display:block;width:125px;text-align:left}.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px}img{width:100%;cursor:zoom-in;background:#eee}figure{margin:0;background:white;padding:8px}textarea{width:95%;height:90px}.box{background:white;padding:16px;margin:16px 0}.hint{color:#555}h2{font-size:19px}</style><aside><b>匿名样本</b><div id="nav"></div></aside><main><h1>匿名影像判读</h1><p>黄色十字定位原10m点；青色框标出所属20m单元。灰色为无观测或影像外，粉色为饱和。固定TOA 0—0.3线性显示；近景按最近邻放大，放大不增加原始细节。</p><p class="hint">请只记录可见依据；无法判断可直接选择。点击图片可查看完整图。本页不显示参考类别、预测或抽样层。</p><div class="box">审阅者编号 <input id="reviewer" placeholder="可追溯编号">经验说明 <input id="experience" placeholder="简短说明"><button onclick="exportReview()">导出意见JSON</button><label>导入意见 <input type="file" accept=".json" onchange="importReview(this)"></label><p id="saveStatus"></p></div><h2 id="heading"></h2><div class="panels" id="panels"></div><div class="box"><label>原10m点候选类别 <select id="point"><option value="">未填写</option><option>Cloud</option><option>Shadow</option><option>Surface</option><option>混合</option><option>无法判断</option></select></label><label>20m单元 <select id="cell"><option value="">未填写</option><option>同质</option><option>混合</option><option>无法判断</option></select></label><label>置信程度 <select id="certainty"><option value="">未填写</option><option>高</option><option>中</option><option>低</option></select></label><p>可见依据（必填；不确定时说明缺项）</p><textarea id="evidence"></textarea><label>需要更大上下文 <select id="context"><option value="">未填写</option><option>是</option><option>否</option><option>不确定</option></select></label><label>需要人工裁决 <select id="human"><option value="">未填写</option><option>是</option><option>否</option><option>不确定</option></select></label><p id="recordStatus"></p><button onclick="move(-1)">上一点</button><button onclick="move(1)">下一点</button></div></main><script>
const ids=["A001", "A002", "A003", "A004", "A005", "A006", "A007", "A008", "A009", "A010", "A011", "A012", "A013", "A014", "A015", "A016", "A017", "A018", "A019", "A020", "A021", "A022", "A023", "A024", "A025", "A026", "A027", "A028", "A029", "A030", "A031", "A032", "A033", "A034", "A035", "A036", "A037", "A038", "A039", "A040", "A041", "A042", "A043", "A044", "A045", "A046", "A047"],key='anonymous_audit_20261014',blank=()=>({anonymous_id:'',status:'not_reviewed',point_candidate_class:null,cell_20m_state:null,visible_evidence:'',confidence:null,larger_context_needed:null,human_arbitration_needed:null});
let data={reviewer_id:'',reviewer_experience:'',review_mode:'human',records:ids.map(id=>({...blank(),anonymous_id:id}))},current=0;
try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&saved.records.length===ids.length&&saved.records.every((r,i)=>r.anonymous_id===ids[i]))data=saved}catch(e){}
const map={point:'point_candidate_class',cell:'cell_20m_state',certainty:'confidence',evidence:'visible_evidence',context:'larger_context_needed',human:'human_arbitration_needed'};
function nav(){document.getElementById('nav').innerHTML=ids.map((id,i)=>`<button onclick="show(${i})">${id} ${data.records[i].status==='reviewed'?'已记录':data.records[i].status==='draft'?'草稿':'未填写'}</button>`).join('')}
function save(){const r=data.records[current];for(const [id,f] of Object.entries(map))r[f]=document.getElementById(id).value||null;data.reviewer_id=document.getElementById('reviewer').value;data.reviewer_experience=document.getElementById('experience').value;r.status=Object.values(map).every(f=>r[f])?'reviewed':Object.values(map).some(f=>r[f])?'draft':'not_reviewed';localStorage.setItem(key,JSON.stringify(data));document.getElementById('recordStatus').textContent=r.status==='reviewed'?'本点意见已记录（尚未封存）':'本点尚未完成';nav();document.getElementById('saveStatus').textContent='本浏览器本地保存；请导出JSON交付。'}
function show(i){current=i;const r=data.records[i];document.getElementById('heading').textContent=ids[i];document.getElementById('reviewer').value=data.reviewer_id||'';document.getElementById('experience').value=data.reviewer_experience||'';for(const [id,f] of Object.entries(map))document.getElementById(id).value=r[f]||'';document.getElementById('panels').innerHTML=[[640,'RGB','640m近景：原生10m RGB'],[640,'FALSE','640m近景：原生20m NIR/R/G'],[10240,'RGB','10.24km上下文：原生10m RGB'],[10240,'FALSE','10.24km上下文：原生20m NIR/R/G']].map(([w,k,title])=>`<figure><figcaption>${title}</figcaption><img alt="${ids[i]} ${title}" src="assets/${ids[i]}_${w}_${k}.png" onclick="window.open(this.src,'_blank')"></figure>`).join('');document.getElementById('recordStatus').textContent=r.status==='reviewed'?'本点意见已记录（尚未封存）':'本点未审阅或尚未完成';nav()}
function move(d){save();show(Math.max(0,Math.min(ids.length-1,current+d)))}
function exportReview(){save();const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='blind_review_submission.json';a.click();URL.revokeObjectURL(a.href)}
async function importReview(input){const x=JSON.parse(await input.files[0].text());if(x.records.length!==ids.length||!x.records.every((r,i)=>r.anonymous_id===ids[i]))throw Error('匿名编号不匹配');data=x;localStorage.setItem(key,JSON.stringify(data));show(current)}
for(const id of [...Object.keys(map),'reviewer','experience'])document.getElementById(id).addEventListener('change',save);show(0);
</script></html>
